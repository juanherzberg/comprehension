<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="app-style">
/* Layout: one warm reading column with the question thread as a side rail; tactile, rounded controls that respond to every choice. */
:root{
  --bg:#FFF5EA; --surface:#FFFFFF; --ink:#2B2238; --muted:#7B6F84; --line:#F1DFCC; --line-2:#E7CDB3;
  --accent:#6A48F2; --accent-2:#5233D6; --accent-ink:#FFFFFF; --accent-soft:#EEE8FF;
  --sun:#FFD15C; --sun-soft:#FFEDB8;
  --carry:#16996A; --carry-2:#0E7A53; --carry-soft:#DBF5E8;
  --dead:#D98A0E; --dead-soft:#FFF0D4;
  --off:#E04A6E; --off-soft:#FFE4EB;
  --ans:#2F7FE0; --ans-soft:#E2EEFF;
  --mark-ink:#2B2238;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Plus Jakarta Sans", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  --shadow:0 1px 2px rgba(60,40,30,.05),0 4px 14px rgba(60,40,30,.05);
  --spring:cubic-bezier(.3,1.2,.6,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1626; --surface:#262035; --ink:#F5EFF9; --muted:#B5A9C0; --line:#382F49; --line-2:#4A3F5E;
    --accent:#A58FFF; --accent-2:#8670EE; --accent-ink:#1B1626; --accent-soft:#2F2752;
    --sun:#E8B94A; --sun-soft:#4A3B17;
    --carry:#4FD39C; --carry-2:#2FAF7B; --carry-soft:#183A2C;
    --dead:#F0B04A; --dead-soft:#3D2E14;
    --off:#FF85A2; --off-soft:#43202C;
    --ans:#7FB2FF; --ans-soft:#1E2E4A;
    --mark-ink:#FFF6DA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1626; --surface:#262035; --ink:#F5EFF9; --muted:#B5A9C0; --line:#382F49; --line-2:#4A3F5E;
  --accent:#A58FFF; --accent-2:#8670EE; --accent-ink:#1B1626; --accent-soft:#2F2752;
  --sun:#E8B94A; --sun-soft:#4A3B17;
  --carry:#4FD39C; --carry-2:#2FAF7B; --carry-soft:#183A2C;
  --dead:#F0B04A; --dead-soft:#3D2E14;
  --off:#FF85A2; --off-soft:#43202C;
  --ans:#7FB2FF; --ans-soft:#1E2E4A;
  --mark-ink:#FFF6DA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.muted{color:var(--muted)}
q{quotes:"\201C" "\201D"}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px max(16px,calc((100% - 1100px)/2))}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-mark{display:inline-flex;gap:3px}
.brand-mark i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand-mark i:nth-child(2){background:var(--sun)} .brand-mark i:nth-child(3){background:var(--carry)}
.back{color:var(--muted);font-weight:700;white-space:nowrap;background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:999px}
.back:hover{color:var(--ink);background:var(--surface)}
.ttl{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hud{display:flex;gap:10px;align-items:center;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.skip{padding:6px 12px;font-size:.85rem;white-space:nowrap}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.8125rem}
.streak{display:inline-flex;align-items:center;gap:4px;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;font-weight:800;font-size:.8125rem}
.streak svg{width:14px;height:14px;fill:var(--dead)}
.streak.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1);opacity:1}}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2);transition:all .45s var(--spring)}
.dots i.done{background:var(--accent)}
.dots i.now{width:22px;border-radius:999px;background:var(--accent)}

/* buttons: tactile, with a bottom edge that presses down */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:none;transition:transform .12s ease,box-shadow .12s ease,filter .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.primary:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:4px 4px;color:var(--accent);font-weight:800;cursor:pointer}
.link.danger{color:var(--off)}

/* library */
.lib{max-width:1100px;margin:0 auto;padding:44px 16px 72px;display:grid;gap:44px}
.intro{max-width:680px;display:grid;gap:14px}
.intro h1{font-weight:800;font-size:clamp(2rem,4.4vw,2.9rem);line-height:1.08;letter-spacing:-.02em}
.intro h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);padding:0 .08em}
.intro p{color:var(--muted);font-size:1.0625rem;margin:0;max-width:58ch;font-weight:600}
.sec-h{margin-bottom:14px}
.sec-h h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:800;border-radius:999px;padding:4px 12px}
.chip.carry{background:var(--carry-soft);color:var(--carry)} .chip.dead{background:var(--dead-soft);color:var(--dead)} .chip.off{background:var(--off-soft);color:var(--off)} .chip.answered{background:var(--ans-soft);color:var(--ans)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{display:grid;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;box-shadow:none;transition:transform .2s var(--spring),box-shadow .2s,border-color .2s}
.mode:hover{border-color:var(--accent)}

.mode.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mode-top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.mode-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.8125rem;font-weight:800}
.mode.on .mode-n{background:var(--accent);color:var(--accent-ink)}
.mode-desc{color:var(--muted);font-size:.9rem;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:none;transition:transform .25s var(--spring),box-shadow .25s}
.card:hover{border-color:var(--line-2)}
.card h3{font-weight:800;font-size:1.25rem;line-height:1.2}
.card .hook{margin:0;color:var(--muted);font-family:var(--f-read);font-style:italic;font-size:1.05rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.tag.ghost{background:var(--bg);color:var(--muted)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;flex-wrap:wrap}
.meta{font-size:.8125rem;color:var(--muted);font-weight:700}
.tutor{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border:2px dashed var(--line-2);border-radius:var(--r);padding:22px}
.tutor h2{font-size:1.05rem;font-weight:800}
.tutor p{margin:4px 0 0;color:var(--muted);max-width:60ch;font-weight:600}
footer.note{font-size:.8125rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;font-weight:600}

/* reading */
.read{max-width:1100px;margin:0 auto;padding:30px 16px 72px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:40px;align-items:start}
.col{display:grid;gap:22px;max-width:700px}
.trail{display:grid;gap:2px}
.trail-s{display:flex;gap:10px;text-align:left;background:none;border:0;padding:6px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;font-family:var(--f-read);font-size:1.05rem;line-height:1.5;color:var(--muted)}
.trail-s .tx{filter:blur(4px);opacity:.5;transition:filter .4s ease,opacity .4s ease;user-select:none}
.trail-s:hover{background:var(--surface)}
.trail-s.peek .tx{filter:none;opacity:1;user-select:text}
.trail-s.just-left{animation:settle .7s var(--spring) both}
.trail-s.just-left .tx{animation:fadeAway 1.2s ease both}
@keyframes settle{from{transform:translateY(40px) scale(1.15);transform-origin:left top}to{transform:none}}
@keyframes fadeAway{0%{filter:blur(0);opacity:1}40%{filter:blur(0);opacity:1}100%{filter:blur(4px);opacity:.5}}
.num{font-family:var(--f-ui);font-size:.75rem;font-weight:800;color:var(--muted);min-width:18px;padding-top:.35em;font-variant-numeric:tabular-nums}
.trail-hint{font-size:.8125rem;color:var(--muted);margin:4px 0 0;font-weight:600}
.answers{display:inline-flex;align-self:start;justify-self:start;gap:8px;align-items:center;font-size:.875rem;font-weight:800;color:var(--carry);background:var(--carry-soft);border-radius:999px;padding:5px 14px 5px 10px;animation:pop .55s .55s var(--spring) both}
.answers svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.answers.muted{color:var(--muted);background:var(--surface)}
@keyframes pop{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:none}}
.current{display:flex;gap:10px;animation:rise .6s var(--spring) both}
.current.leaving{animation:leave .28s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-18px) scale(.97);filter:blur(2px)}}
.sent{margin:0;font-family:var(--f-read);font-size:clamp(1.4rem,2.7vw,1.7rem);line-height:1.5;letter-spacing:-.005em;max-width:34em}
mark.ans{color:var(--mark-ink);padding:0 .12em;border-radius:6px;background-image:linear-gradient(var(--sun),var(--sun));background-repeat:no-repeat;background-position:0 85%;background-size:0% 40%;background-color:transparent;animation:sweep .9s .35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes sweep{0%{background-size:0% 40%}60%{background-size:100% 40%}100%{background-size:100% 100%}}
.blank{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--accent);margin:0 .15em;}
@keyframes blink{50%{border-color:var(--line-2)}}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;box-shadow:none;animation:rise .55s .12s var(--spring) both}
.ask-h{margin:0;font-weight:800;font-size:1.05rem}
.ask-sub{margin:-8px 0 0;color:var(--muted);font-size:.9rem;font-weight:600}
.opts{display:grid;gap:10px}
.opt{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px;padding:13px 16px;cursor:pointer;font-size:1.02rem;font-weight:600;line-height:1.35;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:none;transition:transform .15s var(--spring),box-shadow .15s,border-color .15s,background .2s,opacity .3s}
.opts .opt:nth-child(1){animation:pop .45s .25s var(--spring) both}
.opts .opt:nth-child(2){animation:pop .45s .33s var(--spring) both}
.opts .opt:nth-child(3){animation:pop .45s .41s var(--spring) both}
.opts.settled .opt{animation:none}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt .lab{font-size:.75rem;font-weight:800;white-space:nowrap;border-radius:999px;padding:2px 9px;background:var(--surface)}
.opt.k-carry{border-color:var(--carry);background:var(--carry-soft);box-shadow:none} .opt.k-carry .lab{color:var(--carry)}
.opt.k-dead{border-color:var(--dead);background:var(--dead-soft);box-shadow:none} .opt.k-dead .lab{color:var(--dead)}
.opt.k-off{border-color:var(--off);background:var(--off-soft);box-shadow:none} .opt.k-off .lab{color:var(--off)}
.opt.k-answered{border-color:var(--ans);background:var(--ans-soft);box-shadow:none} .opt.k-answered .lab{color:var(--ans)}
.opt.dim{opacity:.45}
.opt.pop{animation:popBig .55s var(--spring)}
.opt.wiggle{animation:wiggle .5s ease}
.opt.glow{animation:glow 1.6s ease .3s 1}
@keyframes popBig{0%{transform:scale(.985)}100%{transform:scale(1)}}
@keyframes wiggle{25%{transform:translateX(-3px)}60%{transform:translateX(2px)}}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--carry-soft)}}
.fb{margin:0;padding:12px 14px;border-radius:14px;font-size:.98rem;font-weight:600;background:var(--bg);display:grid;gap:4px;animation:pop .45s var(--spring) both}
.fb b{font-weight:800}
.fb.carry{background:var(--carry-soft)} .fb.carry b{color:var(--carry)}
.fb.dead{background:var(--dead-soft)} .fb.dead b{color:var(--dead)}
.fb.off{background:var(--off-soft)} .fb.off b{color:var(--off)}
.fb.answered{background:var(--ans-soft)} .fb.answered b{color:var(--ans)}
.emo{display:inline-block;font-size:1.2em;line-height:1;margin-right:8px;vertical-align:-.1em;transform-origin:50% 80%;animation:ponder 2.4s ease-in-out .4s 1}
@keyframes ponder{0%,100%{transform:rotate(0)}35%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
.ring-wrap{position:relative;width:54px;height:54px;flex:none}
.ring-wrap .emo{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:22px;animation:ponder 2.4s ease-in-out .3s 1}
.hm{font-size:1.05em;margin-right:4px}
.sig{border-bottom:2px solid transparent;transition:color .5s ease,border-color .5s ease}
.sigs-on .sig{color:var(--accent);border-bottom-color:var(--accent)}
.signal{display:grid;gap:4px;padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);animation:pop .45s .15s var(--spring) both}
.signal p{margin:0;font-weight:600;font-size:.95rem}
.sig-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.chip.sigc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.think{display:flex;align-items:center;gap:16px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;transform:rotate(-90deg);transform-origin:50% 50%;animation:fill 3s linear forwards}
@keyframes fill{to{stroke-dashoffset:0}}
textarea,input[type=text],select{width:100%;background:var(--bg);border:2px solid var(--line-2);border-radius:14px;padding:11px 14px;line-height:1.45;font-weight:600}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
.thread{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;box-shadow:none}
.thread h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.thread ol{list-style:none;margin:0;padding:0;display:grid}
.thread li{position:relative;padding:0 0 14px 26px;font-size:.95rem;line-height:1.4;font-weight:700}
.thread li::before{content:"";position:absolute;left:4px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--line-2);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line-2)}
.thread li::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;border-radius:2px;background:var(--line)}
.thread li:last-child{padding-bottom:0} .thread li:last-child::after{display:none}
.thread li.got::before{background:var(--carry);box-shadow:0 0 0 2px var(--carry)}
.thread li.new{animation:pop .5s var(--spring) both}
.thread li.new.got::before{animation:ping 1s ease .2s}
@keyframes ping{0%{box-shadow:0 0 0 2px var(--carry)}50%{box-shadow:0 0 0 9px var(--carry-soft)}100%{box-shadow:0 0 0 2px var(--carry)}}
.thread li .yours{display:block;color:var(--muted);font-size:.8125rem;margin-top:2px;font-weight:600}
.thread .stat{font-size:.8125rem;color:var(--muted);border-top:2px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums;font-weight:700}
.spark{position:fixed;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;pointer-events:none;z-index:60;transition:transform .7s cubic-bezier(.15,.8,.3,1),opacity .7s ease}
.spark.sq{border-radius:2px}

/* final */
.final{max-width:820px;margin:0 auto;padding:32px 16px 80px;display:grid;gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;box-shadow:none;animation:rise .6s var(--spring) both}
.panel:nth-child(2){animation-delay:.08s} .panel:nth-child(3){animation-delay:.16s}
.card,.ask,.thread,.panel{box-shadow:var(--shadow)}
.panel h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.chain{list-style:none;margin:0;padding:0;counter-reset:c;display:grid;gap:10px}
.chain li{counter-increment:c;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;font-weight:800;font-size:1.1rem;line-height:1.35}
.chain li::before{content:counter(c);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);font-size:.8rem;font-weight:800}
.chain li.got::before{background:var(--carry);color:var(--surface)}
.chain .yours{grid-column:2;font-size:.8125rem;color:var(--muted);font-weight:600}
.hint{font-size:.8125rem;color:var(--muted);margin:0;font-weight:600}
.full{margin:0;font-family:var(--f-read);font-size:1.15rem;line-height:1.6;max-width:62ch}
.full .ul{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--accent);text-underline-offset:5px}
.qprompt{margin:0;font-weight:800;font-size:1.1rem}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px;padding:13px 16px;cursor:pointer;line-height:1.45;font-weight:600;box-shadow:none;transition:transform .15s var(--spring),box-shadow .15s,border-color .15s;animation:pop .45s var(--spring) both}
.choice:nth-child(2){animation-delay:.06s} .choice:nth-child(3){animation-delay:.12s} .choice:nth-child(4){animation-delay:.18s}
.choices.settled .choice{animation:none}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:active:not(:disabled){transform:scale(.985)}
.choice:disabled{cursor:default}
.letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);font-weight:800;font-size:.85rem}
.choice.right{border-color:var(--carry);background:var(--carry-soft);box-shadow:none} .choice.right .letter{border-color:var(--carry);background:var(--carry);color:var(--surface)}
.choice.right.pop{animation:popBig .6s var(--spring)}
.choice.wrong{border-color:var(--off);background:var(--off-soft);box-shadow:none} .choice.wrong .letter{border-color:var(--off);color:var(--off)}
.choice.wrong.wiggle{animation:wiggle .5s ease}
.choice.dim{opacity:.5}
.verdict{margin:0;font-weight:800;font-size:1.15rem;animation:pop .5s var(--spring) both}
.verdict.right{color:var(--carry)} .verdict.wrong{color:var(--off)}
.expl{margin:0;line-height:1.6;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat-chip{background:var(--bg);border-radius:999px;padding:5px 13px;font-size:.875rem;font-weight:800;font-variant-numeric:tabular-nums}
.your-pred{margin:0;font-size:.95rem;color:var(--muted);font-weight:600}
.your-pred b{color:var(--ink);font-weight:800}

/* editor */
.ed{max-width:880px;margin:0 auto;padding:34px 16px 80px;display:grid;gap:22px}
.ed h1{font-weight:800;font-size:2rem}
.ed .lede{margin:6px 0 0;color:var(--muted);max-width:64ch;font-weight:600}
.ed .panel{animation:none}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.step{border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.step-s{margin:0;font-family:var(--f-read);font-size:1.05rem;line-height:1.45}
.step-s .num{margin-right:6px}
.qrow{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}
.qrow .k{font-size:.8125rem;font-weight:800}
.qrow .k.carry{color:var(--carry)}
.opt-ed{display:grid;gap:6px;border-left:4px solid var(--line-2);padding-left:10px}
.opt-ed.carry{border-color:var(--carry)}
.opt-ed .two{display:grid;grid-template-columns:170px 1fr;gap:8px}
.status{margin:0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:.95rem;font-weight:700}
.status.err{background:var(--off-soft)}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.9rem}

@media (max-width:880px){
  .read{grid-template-columns:1fr;gap:24px}
  .thread{position:static}
  .modes{grid-template-columns:1fr}
}
@media (max-width:540px){
  .grid2,.qrow,.opt-ed .two{grid-template-columns:1fr}
  .hud .pill,.dots{display:none}
  .opt{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  mark.ans{background-size:100% 100%}
  .ring .fg{stroke-dashoffset:0}
}

/* ---------- reading ---------- */
function startPassage(id){

}
function threadHTML(){

    var isNew = S.anim && k === S.thread.length - 1;

}

    '<div class="grid2"><div class="field"><label for="f-skill">SAT skill</label>' + sel("skill", E.skill, SKILLS, "f-skill") + '</div>' +
    '<div class="field"><label for="f-domain">Subject</label>' + sel("domain", E.domain, DOMAINS, "f-domain") + '</div></div>' +
    '<div class="field"><label for="f-hook">Teaser (optional)</label>' + inp("hook", E.hook, "One line that makes a student curious", "f-hook") + '</div>' +
   '</section>' +
   '<section class="panel"><h2>Passage</h2>' +
    '<div class="field"><label for="f-text">One sentence per line</label><textarea id="f-text" data-bind="text" rows="8" placeholder="Paste the passage, then split it into sentences.">' + esc(E.text) + '</textarea>' +
    '<p class="hint">Use ______ (six underscores) for a fill-in blank.</p></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-action="split">Split into sentences</button><button class="btn primary" data-action="steps">' + (E.built ? 'Update question steps' : 'Set up question steps') + '</button></div>' +
   '</section>' +
   stepsHTML() +
   '<section class="panel"><h2>SAT question</h2>' +
    '<div class="field"><label for="f-prompt">Question</label>' + inp("q.prompt", Q.prompt, "Which choice best states the main idea of the text?", "f-prompt") + '</div>' +
    [0,1,2,3].map(function(k){ return '<div class="qrow"><label class="chk" for="f-ch' + k + '"><input type="radio" name="correct" data-bind="q.correct" value="' + k + '"' + (Number(Q.correct)===k?' checked':'') + ' aria-label="Mark ' + "ABCD"[k] + ' as correct"> Choice ' + "ABCD"[k] + '</label>' + inp("q.choices."+k, Q.choices[k], "", "f-ch"+k) + '</div>'; }).join('') +
    '<p class="hint">Select the circle next to the correct choice.</p>' +
    '<div class="field"><label for="f-expl">Explanation</label><textarea id="f-expl" data-bind="q.explanation" rows="3" placeholder="Tie the answer back to the question chain.">' + esc(Q.explanation) + '</textarea></div>' +
    '<div class="field"><label for="f-ul">Underlined sentence number (optional)</label>' + inp("q.underline", Q.underline, "For example, 3", "f-ul") + '</div>' +
   '</section>' +
   '<div class="row"><button class="btn" data-action="home">Cancel</button><button class="btn primary" data-action="save">Save passage</button></div>' +
   '<section class="panel"><h2>Backup</h2><p class="hint">Copy this passage as text to keep a backup or move it to another page, or paste a copied passage to load it here.</p>' +
    '<textarea id="f-import" data-bind="importText" rows="3" placeholder="Paste a copied passage here">' + esc(E.importText) + '</textarea>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-action="copyjson">Copy this passage</button><button class="btn" data-action="importjson">Load pasted passage</button></div></section>' +
  '</main>';
}
function setPath(obj, path, val){
  var parts = path.split("."), o = obj;
  for (var i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function buildPassage(){
  var L = lines(), errs = [];
  if (!E.title.trim()) errs.push("Add a title.");
  if (L.length < 2) errs.push("The passage needs at least two sentences, one per line.");
  if (!E.built) errs.push("Click “Set up question steps” and fill them in.");
  var sentences = L.map(function(t, k){
    var st = E.steps[k] || blankStep(), last = k === L.length - 1;
    var s = {text:t};
    if (k > 0 && st.answer && st.answer.trim()){
      s.answer = st.answer.trim();
      if (t.indexOf(s.answer) < 0) errs.push("Sentence " + (k+1) + ": the answer words don’t match the sentence exactly.");
    }
    if (st.sigW && st.sigW.trim()){
      var w = st.sigW.trim();
      if (t.toLowerCase().indexOf(w.toLowerCase()) < 0) errs.push("Sentence " + (k+1) + ": the signal word doesn’t appear in the sentence.");
      s.signals = [{w:w, note:(st.sigN||"").trim()}];
    }
    if (!last){
      if (st.opts.some(function(o){ return !o.q.trim(); })) errs.push("Sentence " + (k+1) + ": fill in all three questions.");
      s.questions = st.opts.map(function(o, m){ return {q:o.q.trim(), kind:m === 0 ? "carry" : o.kind, note:o.note.trim()}; });
    }
    return s;
  });
  var Q = E.q;
  if (!Q.prompt.trim()) errs.push("Add the SAT question.");
  if (Q.choices.some(function(c){return !c.trim();})) errs.push("Fill in all four answer choices.");
  var ul = parseInt(Q.underline, 10);
  var question = {prompt:Q.prompt.trim(), choices:Q.choices.map(function(c){return c.trim();}), correct:Number(Q.correct)||0, explanation:Q.explanation.trim()};
  if (!isNaN(ul) && ul >= 1 && ul <= L.length) question.underline = ul - 1;
  var id = E.id || ("c-" + (E.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32) || "passage") + "-" + Date.now().toString(36));
  return {errs:errs, p:{id:id, title:E.title.trim(), skill:E.skill, domain:E.domain, hook:E.hook.trim(), sentences:sentences, question:question}};
}
function upsert(list, p){ var out = list.filter(function(x){return x.id!==p.id;}); out.push(p); return out; }
function buildDoc(list){
  var SC = "<" + "/script>";
  var css = document.getElementById("app-style").textContent;
  var js = document.getElementById("app-js").textContent;
  var data = JSON.stringify(list).replace(/</g, "\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Question Chain</title>\n' +
   '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="' + FONT_HREF.replace(/&/g, "&amp;") + '" rel="stylesheet">\n' +
   '<style id="app-style">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="custom-data">' + data + SC + '\n<script id="app-js">' + js + SC + '\n</body>\n</html>\n';
}
function publishCustom(list){
  var c = window.claude;
  if (!c || typeof c.use !== "function") return Promise.resolve({ok:false, why:"unavailable"});
  return c.use("artifact").then(function(art){
    if (!art) return {ok:false, why:"unavailable"};
    return art.publish(buildDoc(list)).then(function(){ return {ok:true}; });
  }).catch(function(e){ return {ok:false, why:(e && (e.code || e.message)) || "error"}; });
}
function libNote(text, err){
  var n = document.createElement("p"); n.className = "status" + (err ? " err" : ""); n.setAttribute("role","status"); n.textContent = text;
  var lib = document.querySelector(".lib"); if (lib) lib.insertBefore(n, lib.firstChild);
}
function savePassage(){
  var r = buildPassage();
  if (r.errs.length){ edMsg = {err:true, text:r.errs.slice(0,4).join(" ") + (r.errs.length > 4 ? " (" + (r.errs.length-4) + " more)" : "")}; renderEditor(); window.scrollTo(0,0); return; }
  var p = r.p;
  edMsg = {err:false, text:"Saving…"}; renderEditor(); window.scrollTo(0,0);
  publishCustom(upsert(CUSTOM, p)).then(function(res){
    if (res.ok){
      LOCAL = LOCAL.filter(function(x){return x.id!==p.id;}); saveLocal();
      edMsg = {err:false, text:"Saved for everyone who opens this page. The page is reloading with your passage."};
      renderEditor();
    } else {
      LOCAL = upsert(LOCAL, p); saveLocal();
      edMsg = null; E = null; pendingDelete = null;
      go("");
      libNote("Saved in this browser only. Only the page’s owner can add passages for everyone; use Copy this passage to send it to them.");
    }
  });
}
function deletePassage(id){
  if (LOCAL.some(function(x){return x.id===id;})){ LOCAL = LOCAL.filter(function(x){return x.id!==id;}); saveLocal(); pendingDelete = null; renderLibrary(); return; }
  publishCustom(CUSTOM.filter(function(x){return x.id!==id;})).then(function(res){
    pendingDelete = null;
    if (!res.ok){ renderLibrary(); libNote("Couldn’t delete it. Only the page’s owner can remove shared passages.", true); }
  });
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var b = e.target.closest("[data-action]"); if (!b) return;
  var a = b.getAttribute("data-action");
  if (a === "mode"){ mode = b.getAttribute("data-id"); try { localStorage.setItem("qc-mode", mode); } catch (x) {} modeAnim = true; renderLibrary(); var m = document.querySelector('.mode[data-id="' + mode + '"]'); if (m) m.focus(); }
  else if (a === "home"){ E = null; edMsg = null; go(""); }
  else if (a === "pick"){ if (S.picked === null) pick(Number(b.getAttribute("data-j"))); }
  else if (a === "next"){ if (!b.disabled) nextSentence(); }
  else if (a === "showopts"){ if (!b.disabled){ S.revealed = true; renderReading(); } }
  else if (a === "peek"){
    if (b.classList.contains("peek")) return;
    b.classList.add("peek"); S.peeks++; var pn = document.getElementById("peekN"); if (pn) pn.textContent = S.peeks;
    setTimeout(function(){ b.classList.remove("peek"); }, 2600);
  }
  else if (a === "final"){ S.final = {revealed:false, pick:null, predict:""}; renderFinal(false); window.scrollTo(0,0); }
  else if (a === "reveal"){ var pr = document.getElementById("predict"); S.final.predict = pr ? pr.value.trim() : ""; S.final.revealed = true; renderFinal(false); }
  else if (a === "choose"){ if (S.final.pick === null){ S.final.pick = Number(b.getAttribute("data-k")); renderFinal(true); } }
  else if (a === "retry"){ mode = b.getAttribute("data-mode"); try { localStorage.setItem("qc-mode", mode); } catch (x) {} startPassage(S.p.id); window.scrollTo(0,0); }
  else if (a === "add"){ E = blankEditor(); edMsg = null; go("add-passage"); }
  else if (a === "edit"){ var p = findP(b.getAttribute("data-id")); if (p){ E = fromPassage(p); edMsg = null; go("add-passage"); } }
  else if (a === "del"){ var id = b.getAttribute("data-id"); if (pendingDelete === id) deletePassage(id); else { pendingDelete = id; renderLibrary(); } }
  else if (a === "split"){ E.text = splitSentences(E.text).join("\n"); renderEditor(); }
  else if (a === "steps"){ E.built = true; renderEditor(); var st = document.querySelector(".step"); if (st) st.scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block:"start"}); }
  else if (a === "save"){ savePassage(); }
  else if (a === "copyjson"){
    var r = buildPassage();
    var txt = JSON.stringify(r.p);
    var done = function(ok){ edMsg = ok ? {err:false, text:"Copied. Paste it anywhere to keep a backup."} : {err:true, text:"Your browser blocked copying. The passage is in the Backup box below; select it and copy it by hand."}; if (!ok) E.importText = txt; renderEditor(); };
    try { navigator.clipboard.writeText(txt).then(function(){done(true);}, function(){done(false);}); } catch (x) { done(false); }
  }
  else if (a === "importjson"){
    try { var obj = JSON.parse(E.importText); if (!obj || !obj.sentences || !obj.question) throw 0; var keepId = E.id; E = fromPassage(obj); E.id = keepId; edMsg = {err:false, text:"Loaded. Check it over, then save."}; }
    catch (x) { edMsg = {err:true, text:"That text isn’t a copied passage. Use Copy this passage on another page, then paste the result here."}; }
    renderEditor();
  }
});
function onField(e){
  var t = e.target;
  if (t.id === "soloQ" && S) S.solo = t.value;
  var bind = t.getAttribute && t.getAttribute("data-bind");
  if (bind && E) setPath(E, bind, t.type === "radio" ? Number(t.value) : t.value);
}
app.addEventListener("input", onField);
app.addEventListener("change", onField);
window.addEventListener("hashchange", route);
route();
</script>
